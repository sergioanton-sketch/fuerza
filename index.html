<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2457d6">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fuerza">
<title>Fuerza, seguimiento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#f3f4f6;--ink:#14181f;--mut:#65707e;--line:#d9dde3;--acc:#2457d6;--onacc:#fff;--soft:#e4eafa;--warn:#fff1c2;--fi:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;--fh:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1217;--ink:#eceff4;--mut:#9aa5b4;--line:#2a313c;--acc:#7da3ff;--onacc:#0f1217;--soft:#1a2234;--warn:#3a3112;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1217;--ink:#eceff4;--mut:#9aa5b4;--line:#2a313c;--acc:#7da3ff;--onacc:#0f1217;--soft:#1a2234;--warn:#3a3112;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;max-width:560px;padding:0 16px 120px;background:var(--bg);color:var(--ink);font:16px/1.4 var(--fi)}
h1{font:700 30px/1.1 var(--fh);margin:18px 0 6px}
h2{font:700 21px/1.2 var(--fh);margin:26px 0 6px}
.m{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;min-width:0;padding:10px 6px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;font:600 15px var(--fi)}
.seg button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.ex{border-top:1px solid var(--line);padding:14px 0}
.ex .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex b{font:700 20px/1.2 var(--fh)}
.sr{font:700 18px var(--fh);white-space:nowrap}
.rec{margin:4px 0 8px;font-size:14px}
.rec strong{font:700 19px var(--fh);color:var(--acc)}
.r{display:grid;grid-template-columns:24px 1fr 1fr;gap:8px;margin:6px 0;align-items:center}
.r i{color:var(--mut);font-style:normal;font-size:14px}
input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:600 17px var(--fi);font-variant-numeric:tabular-nums}
input[type=checkbox]{width:auto}
button.p{width:100%;padding:14px;border:0;border-radius:10px;background:var(--acc);color:var(--onacc);font:700 17px var(--fi);margin:16px 0 6px}
button.t{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:8px 12px;font:600 14px var(--fi);margin-top:6px}
.warn{background:var(--warn);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;background:var(--bg);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:transparent;color:var(--mut);font:600 15px var(--fi);padding:10px 0;border-radius:8px}
nav button.on{color:var(--acc);background:var(--soft)}
#tm{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--onacc);padding:12px;border-radius:10px;font:700 17px var(--fi);text-align:center}
#tm[hidden]{display:none}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:6px 4px;border-top:1px solid var(--line)}
textarea{width:100%;height:110px;box-sizing:border-box;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px monospace}
svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<main id="v"></main>
<div id="tm" hidden></div>
<nav>
<button data-t="hoy" onclick="go('hoy')">Entrenar</button>
<button data-t="plan" onclick="go('plan')">Plan</button>
<button data-t="prog" onclick="go('prog')">Progreso</button>
<button data-t="aj" onclick="go('aj')">Ajustes</button>
</nav>
<script>
const $=id=>document.getElementById(id),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
f=n=>String(+(+n).toFixed(2)).replace('.',','),
num=v=>parseFloat(String(v).replace(',','.')),
ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
mon=s=>{let x=new Date(s+'T12:00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x)};

/* Plan: [nombre, series, reps mín, reps máx, descanso entre series, salto de carga en kg] */
const PL={'5':{n:'5 días',d:[
['Pecho y tríceps',[['Press banca',4,6,8,'2-3 min',2.5],['Press inclinado con mancuernas',3,8,10,'2-3 min',2],['Fondos (kg extra)',3,8,12,'2-3 min',2.5],['Aperturas en polea',3,12,15,'60-90 s',2.5],['Press cerrado',3,8,10,'2-3 min',2.5],['Extensión de tríceps en polea',3,10,12,'60-90 s',2.5],['Extensión sobre la cabeza',2,12,15,'60-90 s',2.5]]],
['Espalda y bíceps',[['Dominadas / jalón (kg)',4,6,10,'2-3 min',2.5],['Remo con barra',4,6,8,'2-3 min',2.5],['Remo con mancuerna',3,8,10,'60-90 s',2],['Jalón unilateral',3,10,12,'60-90 s',2.5],['Face pull',3,12,15,'60-90 s',2.5],['Curl con barra',3,8,10,'60-90 s',2.5],['Curl inclinado',3,10,12,'60-90 s',1],['Curl martillo',2,12,12,'60-90 s',1]]],
['Pierna completa',[['Sentadilla',4,6,8,'2-3 min',5],['Peso muerto rumano',3,8,10,'2-3 min',5],['Prensa',3,10,10,'2-3 min',5],['Zancadas (por pierna)',3,10,10,'60-90 s',2],['Curl femoral',3,10,12,'60-90 s',2.5],['Extensión de cuádriceps',2,12,15,'60-90 s',2.5],['Gemelos',4,12,15,'60-90 s',2.5]]],
['Hombros y brazos',[['Press militar',4,6,8,'2-3 min',2.5],['Elevaciones laterales',4,12,15,'60-90 s',1],['Pájaros',3,12,15,'60-90 s',1],['Lateral en polea',3,12,15,'60-90 s',1],['Curl con barra',3,8,10,'60-90 s',2.5],['Curl martillo',3,10,12,'60-90 s',1],['Press francés',3,8,10,'60-90 s',2.5],['Tríceps con cuerda',3,12,15,'60-90 s',2.5]]],
['Torso y core',[['Press inclinado',3,8,10,'2-3 min',2.5],['Dominadas / jalón (kg)',3,8,10,'2-3 min',2.5],['Press banca (volumen)',3,8,10,'2-3 min',2.5],['Remo sentado',3,10,12,'60-90 s',2.5],['Elevaciones laterales',3,12,15,'60-90 s',1],['Face pull',2,15,15,'60-90 s',2.5],['Rueda abdominal',3,8,12,'60-90 s',0],['Plancha',3,30,45,'60-90 s',0,'s']]]]},
'3':{n:'3 días',d:[
['Full body A',[['Press banca',4,6,8,'2-3 min',2.5],['Press inclinado con mancuernas',3,8,10,'2-3 min',2],['Remo con barra',4,6,8,'2-3 min',2.5],['Dominadas / jalón (kg)',3,8,10,'2-3 min',2.5],['Sentadilla',4,6,8,'2-3 min',5],['Peso muerto rumano',3,8,10,'2-3 min',5],['Curl inclinado',2,10,12,'60-90 s',1],['Extensión de tríceps',2,10,12,'60-90 s',2.5]]],
['Full body B',[['Sentadilla búlgara (por pierna)',3,8,10,'2-3 min',2],['Curl femoral deslizante',3,10,15,'60-90 s',0],['Press militar',4,6,8,'2-3 min',2.5],['Elevaciones laterales',3,12,15,'60-90 s',1],['Pájaros',3,12,15,'60-90 s',1],['Remo con mancuerna a una mano',3,10,12,'60-90 s',2],['Dominadas / jalón (kg)',3,8,10,'2-3 min',2.5],['Press francés',3,8,10,'60-90 s',2.5]]],
['Full body C',[['Sentadilla goblet',3,10,12,'60-90 s',2],['Peso muerto rumano',3,8,10,'2-3 min',5],['Gemelos con mancuernas',4,12,15,'60-90 s',2],['Fondos inclinados (kg extra)',3,8,12,'2-3 min',2.5],['Press inclinado',3,8,10,'2-3 min',2.5],['Remo con mancuerna',3,10,12,'60-90 s',2],['Face pull',3,12,15,'60-90 s',2.5],['Curl martillo',3,10,12,'60-90 s',1],['Extensión de tríceps',3,10,12,'60-90 s',2.5],['Rueda abdominal',3,8,12,'60-90 s',0]]]]}};

let S={ss:[],bw:[],st:{},plan:'5',day:null,deload:false,sel:null},tab='hoy',tmr=null;
try{let x=localStorage.getItem('fz1');if(x)S={...S,...JSON.parse(x)}}catch(e){}
function save(){try{localStorage.setItem('fz1',JSON.stringify({ss:S.ss,bw:S.bw,st:S.st,plan:S.plan}))}catch(e){}}
function msg(t){let m=$('msg');if(m)m.textContent=t}

/* Doble progresión: si completas todas las series en el máximo de reps, subes carga */
function rec(e,dl){
 let [n,ns,lo,hi,,inc,u]=e,un=u?' s':' reps',h=[...S.ss].reverse().find(s=>!s.dl&&s.ex[n]&&s.ex[n].length),w=null,why='Sin historial: calibra con 2 repeticiones en reserva';
 if(!h){if(S.st[n]!=null&&S.st[n]!==''){w=+S.st[n];why='Tu peso inicial'}}
 else{
  let a=h.ex[n],w0=a[0][0],ok=a.length>=ns&&a.every(x=>x[1]>=hi),avg=a.reduce((t,x)=>t+x[1],0)/a.length;
  if(ok){w=w0+inc;why=inc?'Subes: hiciste '+a.length+' series de '+hi+' o más':'Llegaste al máximo del rango: añade lastre o una variante más difícil'}
  else if(avg<lo){w=Math.max(0,w0-inc);why=w<w0?'Bajas: media de '+f(avg)+' reps, el mínimo es '+lo:'Aún no llegas al mínimo de '+lo+un+': mantén este peso'}
  else{w=w0;why='Repites'+(w0?' '+f(w0)+' kg':'')+': busca '+hi+un+' en todas las series'}
 }
 if(w!=null&&dl){let st=inc>=2.5?2.5:1;w=Math.round(w*.9/st)*st;why='Descarga, 10 % menos que tu referencia'}
 return{w,why}}
function due(x){let k=new Set();for(let s of [...S.ss].reverse()){if(s.dl)break;k.add(mon(s.d))}if(x)k.delete(mon(ymd(new Date())));return k.size}
function autoDl(){let l=S.ss[S.ss.length-1];return due(1)>=6||!!(l&&l.dl&&mon(l.d)===mon(ymd(new Date())))}
function nextDay(){let l=[...S.ss].reverse().find(s=>s.plan===S.plan);return l?(l.day+1)%PL[S.plan].d.length:0}

const BA=['Press banca','Sentadilla','Peso muerto','Press militar','Peso muerto rumano','Remo con barra','Press inclinado con barra','Press inclinado','Press banca (volumen)'];
function wu(n,w){if(!BA.includes(n)||!(w>=30))return '';let a=w>=40?[[20,'10']]:[];[[.5,'6-8'],[.7,'4'],[.8,'2-3'],[.9,'1']].forEach(([p,r])=>{let x=Math.round(p*w/2.5)*2.5;if(x>=20&&x<w&&(!a.length||x>a[a.length-1][0]))a.push([x,r])});return a.length?`<div class="m" style="margin:-4px 0 8px">Aproximación, kg × reps: ${a.map(x=>f(x[0])+' × '+x[1]).join(', ')}</div>`:''}
function exb(e,inp){
 let [n,ns,lo,hi,re,,u]=e,g=(lo===hi?lo:lo+'-'+hi)+(u?' s':''),r=rec(e,inp&&S.deload),m=re.match(/(\d+)(?:-(\d+))? (min|s)/),sec=(+(m[2]||m[1]))*(m[3]==='min'?60:1);
 return `<div class="ex"><div class="h"><b>${esc(n)}</b><span class="sr">${ns} × ${g}</span></div><div class="rec">${r.w!=null?`Recomendado <strong>${r.w===0?'peso corporal':f(r.w)+' kg'}</strong>`:'Sin referencia'}, descanso entre series ${re}<br><span class="m">${esc(r.why)}</span></div>${wu(n,r.w)}`
 +(inp?Array.from({length:ns},(_,j)=>`<div class="r" data-n="${esc(n)}"><i>${j+1}</i><input inputmode="decimal" placeholder="kg" value="${r.w!=null?f(r.w):''}"><input inputmode="numeric" placeholder="${g}${u?'':' reps'}"></div>`).join('')+`<button class="t" onclick="rest(${sec})">Iniciar descanso</button>`:'')+`</div>`}

function hoy(){
 let p=PL[S.plan],di=S.day??nextDay(),d=p.d[di],n=due(1),lb=S.bw.length?S.bw[S.bw.length-1]:null;S.day=di;let wk=mon(ymd(new Date()));if(S.dlWk!==wk){S.deload=autoDl();S.dlWk=wk}
 return `<h1>Entrenar</h1><div class="seg">${Object.keys(PL).map(k=>`<button class="${k===S.plan?'on':''}" onclick="S.plan='${k}';S.day=null;go('hoy')">Semana de ${PL[k].n}</button>`).join('')}</div>
<div class="seg" style="flex-wrap:wrap">${p.d.map((x,i)=>`<button class="${i===di?'on':''}" onclick="S.day=${i};go('hoy')">${esc(x[0])}</button>`).join('')}</div>`
 +(n>=6?`<div class="warn">Llevas ${n} semanas seguidas entrenando, así que esta semana toca descarga. ${S.deload?'Ya está activada y las cargas van un 10 % más bajas. Puedes desmarcar la casilla si prefieres no hacerla.':'Activa la casilla para bajar las cargas un 10 %.'}</div>`:'')
 +`<label class="row m"><input type="checkbox" ${S.deload?'checked':''} onchange="S.deload=this.checked;go('hoy')"> Semana de descarga, 10 % menos de carga</label>
<div class="row" style="margin-top:10px"><input id="dt" type="date" value="${ymd(new Date())}" style="flex:1"><input id="bw" inputmode="decimal" placeholder="Peso corporal, kg" style="flex:1"></div>
<p class="m" style="margin:4px 0 0">${lb?'Último peso registrado: '+f(lb[1])+' kg ('+lb[0]+')':'Anota tu peso corporal para seguir su evolución.'}</p>`
 +d[1].map(e=>exb(e,true)).join('')+`<button class="p" onclick="guardar()">Guardar sesión</button><p class="m" id="msg"></p>`}

function guardar(){
 let ex={};document.querySelectorAll('.r').forEach(r=>{let i=r.querySelectorAll('input'),kg=num(i[0].value),rp=parseInt(i[1].value);if(rp>0&&kg>=0)(ex[r.dataset.n]=ex[r.dataset.n]||[]).push([kg,rp])});
 if(!Object.keys(ex).length)return msg('Introduce al menos una serie con kilos y repeticiones.');
 let bw=num($('bw').value),d=$('dt').value||ymd(new Date());
 S.ss.push({d,plan:S.plan,day:S.day,dl:S.deload,bw:bw>0?bw:null,ex});S.ss.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
 if(bw>0){S.bw=S.bw.filter(x=>x[0]!==d);S.bw.push([d,bw]);S.bw.sort((a,b)=>a[0]<b[0]?-1:1)}
 save();S.day=null;go('hoy');msg('Sesión guardada. Las recomendaciones ya se han actualizado.')}

function plan(){let p=PL[S.plan];
 return `<h1>Plan</h1><div class="seg">${Object.keys(PL).map(k=>`<button class="${k===S.plan?'on':''}" onclick="S.plan='${k}';S.day=null;go('plan')">Semana de ${PL[k].n}</button>`).join('')}</div>`
 +p.d.map(x=>`<h2>${esc(x[0])}</h2>`+x[1].map(e=>exb(e,false)).join('')).join('')
 +`<h2>Cómo se calculan los pesos</h2><p class="m">Cada ejercicio tiene un rango de repeticiones. Cuando completas todas las series en el máximo del rango, la app te recomienda subir carga en la siguiente sesión. Si no llegas, repites el peso. Si la media queda por debajo del mínimo, baja un escalón. Tras 6 semanas seguidas entrenando, la app activa sola una semana de descarga con un 10 % menos de carga, y puedes desmarcarla. Las dominadas y los fondos se registran con los kilos extra (0 si solo usas tu peso). En los ejercicios básicos verás también las series de aproximación, calculadas a partir del peso recomendado. No hace falta registrarlas: anota solo las series de trabajo. Trabaja casi siempre a 1-2 repeticiones en reserva.</p>`}

function chart(pts){
 if(pts.length<2)return '<p class="m">Registra al menos dos datos para ver la evolución.</p>';
 pts=pts.slice(-30);let ys=pts.map(p=>p[1]),mn=Math.min(...ys),mx=Math.max(...ys),pd=(mx-mn)||1,X=i=>34+i*(296/(pts.length-1)),Y=y=>112-(y-mn)/pd*88;
 return `<svg viewBox="0 0 340 140" role="img" aria-label="Evolución"><polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="${pts.map((p,i)=>X(i)+','+Y(p[1])).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p[1])}" r="3.5" fill="var(--acc)"/>`).join('')}<text x="2" y="26" font-size="11" fill="var(--mut)">${f(mx)}</text><text x="2" y="116" font-size="11" fill="var(--mut)">${f(mn)}</text><text x="34" y="136" font-size="11" fill="var(--mut)">${pts[0][0].slice(5)}</text><text x="330" y="136" font-size="11" text-anchor="end" fill="var(--mut)">${pts[pts.length-1][0].slice(5)}</text></svg>`}

function prog(){
 let names=[...new Set(S.ss.flatMap(s=>Object.keys(s.ex)))],sel=names.includes(S.sel)?S.sel:names[0],h=`<h1>Progreso</h1><h2>Peso corporal</h2>`+chart(S.bw)
 +`<div class="row"><input id="bw2" inputmode="decimal" placeholder="Peso de hoy, kg" style="flex:1"><button class="t" style="margin:0" onclick="addBw()">Guardar peso</button></div><h2>Evolución por ejercicio</h2>`;
 if(!sel)return h+'<p class="m">Cuando guardes tu primera sesión verás aquí la evolución de cada ejercicio.</p>'+tabla();
 let hs=S.ss.filter(s=>s.ex[sel]),any=hs.some(s=>s.ex[sel].some(x=>x[0]>0)),met=s=>Math.max(...s.ex[sel].map(x=>any?x[0]*(1+x[1]/30):x[1]));
 return h+`<select onchange="S.sel=this.value;go('prog')">${names.map(n=>`<option ${n===sel?'selected':''}>${esc(n)}</option>`).join('')}</select><p class="m" style="margin:8px 0 0">${any?'Fuerza estimada en kg (mejor serie de cada sesión)':'Mejor serie en repeticiones'}</p>`+chart(hs.map(s=>[s.d,met(s)]))
 +`<table><tr><th>Fecha</th><th>Series</th><th>Volumen</th></tr>${hs.slice(-8).reverse().map(s=>`<tr><td>${s.d.slice(5)}</td><td>${s.ex[sel].map(x=>f(x[0])+'×'+x[1]).join(', ')}</td><td>${Math.round(s.ex[sel].reduce((t,x)=>t+x[0]*x[1],0))} kg</td></tr>`).join('')}</table>`+tabla()}
function tabla(){
 return `<h2>Últimas sesiones</h2>`+(S.ss.length?`<table><tr><th>Fecha</th><th>Sesión</th><th>Volumen</th></tr>${[...S.ss].reverse().slice(0,8).map(s=>`<tr><td>${s.d.slice(5)}</td><td>${esc((PL[s.plan].d[s.day]||['?'])[0])}${s.dl?' (descarga)':''}</td><td>${Math.round(Object.values(s.ex).flat().reduce((t,x)=>t+x[0]*x[1],0))} kg</td></tr>`).join('')}</table><p class="m">Sesiones registradas: ${S.ss.length}</p>`:'<p class="m">Aún no hay sesiones.</p>')}
function addBw(){let v=num($('bw2').value),d=ymd(new Date());if(!(v>0))return;S.bw=S.bw.filter(x=>x[0]!==d);S.bw.push([d,v]);S.bw.sort((a,b)=>a[0]<b[0]?-1:1);save();go('prog')}

function aj(){
 let names=[...new Set(Object.values(PL).flatMap(p=>p.d.flatMap(d=>d[1].map(e=>e[0]))))];
 return `<h1>Ajustes</h1><h2>Pesos iniciales</h2><p class="m">Opcional. Con tu peso de trabajo actual en cada ejercicio, la app calcula la primera recomendación. Si lo dejas vacío, calibra con 2 repeticiones en reserva y registra la serie.</p>`
 +names.map(n=>`<div class="row" style="margin:6px 0"><span style="flex:1">${esc(n)}</span><input style="width:96px" inputmode="decimal" data-n="${esc(n)}" value="${S.st[n]!=null?f(S.st[n]):''}" placeholder="kg" onchange="setSt(this.dataset.n,this.value)"></div>`).join('')
 +`<h2>Copia de seguridad</h2><p class="m">Tus datos se guardan solo en este navegador. Copia este texto y guárdalo en un lugar seguro. Para restaurar, pégalo aquí y pulsa Restaurar.</p><textarea id="bk">${esc(JSON.stringify({ss:S.ss,bw:S.bw,st:S.st}))}</textarea><div class="row"><button class="t" onclick="cp()">Copiar</button><button class="t" onclick="rs()">Restaurar</button><button class="t" onclick="rz(this)">Borrar todo</button></div><p class="m" id="msg"></p>`}
function setSt(n,v){let x=num(v);if(x>=0)S.st[n]=x;else delete S.st[n];save()}
function cp(){let t=$('bk'),ok=false;t.select();try{ok=document.execCommand('copy')}catch(e){}msg(ok?'Copiado.':'Texto seleccionado: cópialo a mano.')}
function rs(){try{let o=JSON.parse($('bk').value);if(!Array.isArray(o.ss))throw 0;S.ss=o.ss;S.bw=Array.isArray(o.bw)?o.bw:[];S.st=o.st||{};save();msg('Datos restaurados.')}catch(e){msg('El texto no es una copia válida.')}}
function rz(b){if(b.dataset.s){S.ss=[];S.bw=[];S.st={};save();go('aj')}else{b.dataset.s=1;b.textContent='Pulsa otra vez para borrar todo'}}

function rest(s){
 clearInterval(tmr);let t=s,el=$('tm');el.hidden=false;
 const u=()=>{if(t<0){clearInterval(tmr);el.textContent='Listo, siguiente serie. Toca para cerrar';try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}return}el.textContent='Descanso '+(t/60|0)+':'+String(t%60).padStart(2,'0')+'. Toca para cerrar';t--};
 u();tmr=setInterval(u,1000)}
$('tm').onclick=()=>{clearInterval(tmr);$('tm').hidden=true};

function go(t){tab=t;$('v').innerHTML={hoy,plan,prog,aj}[t]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));window.scrollTo(0,0)}
go('hoy');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
